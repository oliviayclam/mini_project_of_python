{% extends "base.html" %}
{% block title %}Games — Olivia Portal{% endblock %}

{% block content %}
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

<section class="panel">
  <h1>Map</h1>
  <p class="muted">You can search any country weather and location here.</p>

  <div class="game-grid">
    <article>
      <h2>Country</h2>
      <p>Please select country</p>
      <p id="weather-message" class="ok" style="display: none;"></p>
      <form id="country-form" style="margin-top:0.5rem">
        <div class="form-group">
            <label for="country-select"></label>
            <select name="country" id="country-select" class="dropdown-select" required>
            <option value="" disabled selected>Select a country...</option>
            {% for country in countries %}
              <option value="{{ country.name }}"
                      data-lat="{{ country.lat }}"
                      data-lng="{{ country.lng }}">
                {{ country.name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <button type="submit" id="submit-btn" class="secondary-btn" style="margin-top: 1rem;">
          <span id="btn-text">Confirm</span>
        </button>
      </form>
    </article>

    <article>
      <h2>Location Map</h2>
      <div id="map" style="height: 350px; width: 100%; border-radius: 8px;"></div>
    </article>
  </div>
</section>
<!-- Leaflet JavaScript -->
<!-- Include Leaflet CSS/JS if not already present -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // 1. Initialize Map
  const map = L.map('map').setView([20, 0], 2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  let currentMarker = null;

  // 2. Select Elements
    const form = document.getElementById('country-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const messageElement = document.getElementById('weather-message');
    const selectElement = document.getElementById('country-select');


    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const selectedCountry = selectElement.value;
        // ----------------------------------------------------
        // 3. START LOADING STATE and Handle Form Submit via AJAX
        // ----------------------------------------------------
        submitBtn.disabled = true;                // Prevent double clicking
        btnText.textContent = "Loading...";        // Change button text

        if (messageElement) {
            messageElement.textContent = "Fetching weather data...";
            messageElement.style.display = "block";
        }

        try {
            const response = await fetch("{{ url_for('selected_city') }}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({ country: selectedCountry })
            });

            if (!response.ok) throw new Error(`Server status: ${response.status}`);

            const data = await response.json();

            if (data.status === "success") {
                // Update Weather Message
                if (messageElement) {
                    messageElement.textContent = data.message;
                }

                // Move Map & Marker
                const lat = parseFloat(data.lat);
                const lng = parseFloat(data.lng);

                if (!isNaN(lat) && !isNaN(lng)) {
                    map.invalidateSize();
                    map.flyTo([lat, lng], 5);

                    if (currentMarker) map.removeLayer(currentMarker);

                    currentMarker = L.marker([lat, lng])
                        .addTo(map)
                        .bindPopup(`<b>${data.country}</b><br>${data.message}`)
                        .openPopup();
                }
            }
        } catch (error) {
            console.error("Fetch Error:", error);
            if (messageElement) {
                messageElement.textContent = "Failed to load weather data. Please try again.";
            }
        } finally {
            // ----------------------------------------------------
            // 4. END LOADING STATE (Runs on both success & error)
            // ----------------------------------------------------
            // End Loading:
            submitBtn.disabled = false;
            btnText.textContent = "Confirm";
        }
    });

</script>
{% endblock %}
