{% extends "base.html" %}
{% block title %}Transfer Data — Olivia Portal{% endblock %}
{% block content %}
<section class="panel">
  <h1>Transfer Data</h1>

  <div class="upload-card">
        <h2>Upload Your Files</h2>
        <p>Supports documents, images, and sheets</p>

        <form action="{{ url_for('transfer') }}" method="POST" enctype="multipart/form-data" class="upload-form">
            <!-- Dropzone Label -->
            <label class="dropzone-label">
                <!-- SVG Cloud Icon -->
                <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://w3.org">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <span class="dropzone-text">Click to browse or drag file here</span>

                <!-- Actual Hidden Input -->
                <input type="file" name="file" class="hidden-input" required />
            </label>

            <button type="submit" class="submit-btn">Upload to Server</button>
        </form>
    </div>

  <a class="btn secondary" href="{{ url_for('home') }}" style="margin-top:1.5rem">Back home</a>
</section>
{% endblock %}
